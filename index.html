<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Black Cat </title>
    <style>


        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;


          
            background: linear-gradient(to bottom, #fff9e6 70%, #d2b48c 70%);
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
        }

        h1 { color: #5c4033; margin-bottom: 5px; font-size: 24px; text-align: center; z-index: 10; }
        p { color: #8b5a2b; margin-top: 0; margin-bottom: 30px; font-size: 14px; z-index: 10; }

      
    .cat-furniture { position: absolute; bottom: 30%; left: 15%; width: 80px; height: 180px; background-color: #e6ccb2; border-radius: 10px; z-index: 1; }
    .cat-furniture::before { content: ''; position: absolute; top: -20px; left: -10px; width: 100px; height: 20px; background-color: #b08968; border-radius: 5px; }
    .window { position: absolute; top: 10%; right: 15%; width: 120px; height: 150px; background-color: #e0f7fa; border: 6px solid #fff; border-radius: 5px; z-index: 1; }

     
        .cat-area {
            position: relative;
            width: 200px;
            height: 220px;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.1s ease;
        }

      
        .cat-area:active {
            transform: scale(0.92);
        }

       
        .body-part { position: absolute; bottom: 0; left: 30px; width: 140px; height: 140px; background-color: #222; border-radius: 80px 80px 20px 20px; }
        .head-part { position: absolute; top: 20px; left: 40px; width: 120px; height: 100px; background-color: #222; border-radius: 50%; }
        .left-ear, .right-ear { position: absolute; top: -10px; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid #222; }
        .left-ear { left: 45px; transform: rotate(-15deg); }
        .right-ear { right: 45px; transform: rotate(15deg); }
        .left-eye, .right-eye { position: absolute; top: 50px; width: 30px; height: 30px; background-color: #ffd700; border-radius: 50%; }
        .left-eye { left: 60px; } .right-eye { right: 60px; }
        .left-eye::after, .right-eye::after { content: ''; position: absolute; top: 5px; left: 11px; width: 8px; height: 20px; background-color: #000; border-radius: 50%; }
        .nose-part { position: absolute; top: 75px; left: 95px; width: 10px; height: 8px; background-color: #ffb6c1; border-radius: 50%; }

      
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 35px;
            pointer-events: none;
            z-index: 10;
            animation: smoothFly 1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        @keyframes smoothFly {
            0% { transform: translateY(0) scale(0.3) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(-120px) scale(1.3) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Cute Black Cat </h1>
    <p>Try tapping or petting the cat below!</p>

    <div class="cat-furniture"></div>
    <div class="window"></div>

   
    <div class="cat-area" onclick="petCat(event)">
        <div class="left-ear"></div>
        <div class="right-ear"></div>
        <div class="body-part"></div>
        <div class="head-part"></div>
        <div class="left-eye"></div>
        <div class="right-eye"></div>
        <div class="nose-part"></div>
    </div>

   
  
    <script>
        function petCat(event) {
          
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            heart.style.left = (event.clientX - 15) + 'px';
            heart.style.top = (event.clientY - 30) + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 1000);

           
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
           
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    </script>       


   
</body>
</html>
